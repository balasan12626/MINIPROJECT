services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - floodmongo:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      DATABASE_NAME: flood_response
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./models:/app/models
      - ./dataset:/app/dataset

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  floodmongo:
